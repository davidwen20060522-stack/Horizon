
name: Daily Horizon Summary

on:
  schedule:
    - cron: '0 0 * * *'  # UTC 00:00 = 北京时间 08:00
  workflow_dispatch:

concurrency:
  group: gh-pages-deploy

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - name: Install dependencies
        run: uv sync

      - name: Prepare GitHub Actions config
        run: |
          cp data/config.github.json data/config.json
          python -c "import json; p='data/config.json'; d=json.load(open(p)); d['webhook']['enabled']=False; json.dump(d,open(p,'w'),ensure_ascii=False,indent=2)"

      - name: Run Horizon
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # GitHub 源限流 60→5000 req/h
        run: uv run horizon --hours 24

      - name: Fetch existing Pages archive
        run: git fetch origin gh-pages || true

      - name: Export news JSON
        run: python scripts/export_news_json.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true
          publish_branch: gh-pages
          enable_jekyll: true
